model:
  default: deepseek-v4-flash
  provider: opencode-go
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  model: gpt-5.6-luna
  provider: opencode-go
  max_iterations: 250
skills:
  external_dirs:
    - ~/dotfiles/claude/.claude/skills
  creation_nudge_interval: 15
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - architecture-diagram
    - ascii-art
    - ascii-video
    - baoyu-infographic
    - box
    - claude-design
    - comfyui
    - design-md
    - document-to-action-items
    - email-inbox-triage
    - evaluating-llms-harness
    - excalidraw
    - findmy
    - gif-search
    - google-workspace
    - himalaya
    - huggingface-hub
    - humanizer
    - imessage
    - llama-cpp
    - manim-video
    - maps
    - meeting-action-items
    - notion
    - openhue
    - p5js
    - popular-web-designs
    - powerpoint
    - pretext
    - product-price-monitor
    - sdlc-review
    - serving-llms-vllm
    - sketch
    - songsee
    - songwriting-and-ai-music
    - teams-meeting-pipeline
    - touchdesigner-mcp
    - weights-and-biases
    - xurl
    - youtube-content
hooks:
  pre_tool_call:
    - matcher: terminal|read_file|write_file|patch|search_files
      command: ~/.hermes/agent-hooks/block-sensitive.sh
      timeout: 10
      fail_closed: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 37
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
plugins:
  enabled:
    - herdr-agent-state
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
timezone: Europe/Rome
onboarding:
  seen:
    tool_progress_prompt: true
approvals:
  destructive_slash_confirm: false
